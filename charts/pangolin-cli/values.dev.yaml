# Development / CI override values for the pangolin-cli chart.
# Used by: make lint, make unittest
# These values exercise the chart with a minimal but valid configuration.

global:
  image:
    registry: "ghcr.io"
    repository: "fosrl/cli"
    digest: "sha256:b30c10882405eb39b4d3532302061d461228ad994034567b96d7668343bb2e5e"
  logLevel: "DEBUG"
  metrics:
    enabled: false
  tests:
    enabled: false

  # Minimal script map so `templates/configmap-updown.yaml` can render
  updownScripts:
    demo: |
      #!/bin/sh
      echo up

siteInstances:
  - name: main-tunnel
    enabled: true
    pangolinEndpoint: "https://pangolin.example.com"
    # Inline credentials must be set together (pangolinEndpoint + id + secret); with id
    # missing the chart failed the credential check, so every consumer of this file -
    # make lint, make unittest, scripts/test.sh render and kubeconform - could not render
    # the chart at all.
    id: dev-site-id
    #auth:
    #  existingSecretName: site-cred
    # Minimal env map so `templates/configmap-env.yaml` can render
    extraEnv:
      HELLO: world
    # Minimal updown config so `templates/configmap-updown.yaml` can render
    updown:
      enabled: true
      script: demo
    # Minimal secret so `templates/secret.yaml` can render (dev only)
    secret: CHANGEME
    service:
      enabled: false
