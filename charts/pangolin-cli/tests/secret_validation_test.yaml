suite: Secret validation
templates:
  - templates/secret.yaml
tests:
  - it: renders secret when secret is provided inline with full credentials
    set:
      siteInstances:
        - name: inline-secret
          enabled: true
          pangolinEndpoint: "https://pangolin.example.com"
          id: my-instance-id
          secret: my-secret-value
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: data.SITE_SECRET
          value: "bXktc2VjcmV0LXZhbHVl"
      - equal:
          path: data.PANGOLIN_ENDPOINT
          value: "aHR0cHM6Ly9wYW5nb2xpbi5leGFtcGxlLmNvbQ=="
      - equal:
          path: data.SITE_ID
          value: "bXktaW5zdGFuY2UtaWQ="

  - it: does NOT render secret when existingSecretName is provided (external secret)
    set:
      siteInstances:
        - name: existing-secret
          enabled: true
          auth:
            existingSecretName: my-existing-secret
    asserts:
      - hasDocuments:
          count: 0

  - it: renders secret when mtls enabled with inline p12
    set:
      siteInstances:
        - name: mtls-secret
          enabled: true
          mtls:
            enabled: true
            p12Base64: cGtlMTIz
    asserts:
      - isKind:
          of: Secret

  - it: renders secret when mtls enabled without secretName
    set:
      siteInstances:
        - name: mtls-secret
          enabled: true
          mtls:
            enabled: true
    asserts:
      - isKind:
          of: Secret

  - it: fails when both inline credentials and external auth are provided
    set:
      siteInstances:
        - name: dual-auth
          enabled: true
          pangolinEndpoint: "https://pangolin.example.com"
          id: my-id
          secret: my-inline-secret
          auth:
            existingSecretName: my-existing-secret
    asserts:
      - failedTemplate:
          errorPattern: "Cannot specify both inline credentials.*and external auth"

  - it: fails when no credentials are provided
    set:
      siteInstances:
        - name: no-credentials
          enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "siteInstances: Credentials required"

  - it: adds warning annotation when inline credentials create a Secret
    set:
      siteInstances:
        - name: warn-inline-secret
          enabled: true
          pangolinEndpoint: "https://pangolin.example.com"
          id: my-id
          secret: my-secret-value
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.annotations["pangolin-cli.helm.warning"]
          value: "Inline secrets detected. Use auth.existingSecretName for production deployments to avoid secrets in values."

  - it: renders no secret when envVarsDirect is enabled
    set:
      siteInstances:
        - name: envvars-direct
          enabled: true
          pangolinEndpoint: "https://pangolin.example.com"
          id: my-id
          secret: my-secret
          auth:
            envVarsDirect: true
    asserts:
      - hasDocuments:
          count: 0

  - it: fails when envVarsDirect is enabled but inline credentials missing
    set:
      siteInstances:
        - name: envvars-missing-creds
          enabled: true
          auth:
            envVarsDirect: true
    asserts:
      - failedTemplate:
          errorPattern: "auth\.envVarsDirect is enabled but inline credentials"

  - it: renders Secret with custom auth key names
    set:
      siteInstances:
        - name: custom-keys
          enabled: true
          pangolinEndpoint: "https://pangolin.example.com"
          id: my-id
          secret: my-secret-value
          auth:
            keys:
              endpointKey: CUSTOM_ENDPOINT
              idKey: CUSTOM_ID
              secretKey: CUSTOM_SECRET
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: data.CUSTOM_ENDPOINT
          value: "aHR0cHM6Ly9wYW5nb2xpbi5leGFtcGxlLmNvbQ=="
      - equal:
          path: data.CUSTOM_ID
          value: "bXktaWQ="
      - equal:
          path: data.CUSTOM_SECRET
          value: "bXktc2VjcmV0LXZhbHVl"

  - it: fails when createSecret is false for inline credentials without another auth mode
    set:
      siteInstances:
        - name: no-secret-mode
          enabled: true
          pangolinEndpoint: "https://pangolin.example.com"
          id: my-id
          secret: my-secret-value
          auth:
            createSecret: false
            envVarsDirect: false
    asserts:
      - failedTemplate:
          errorPattern: "siteInstances: Credentials required"

  # pangolinEndpoint is the server address and is required in every auth mode, so it must
  # not count towards the partial-inline-credentials check. Six shipped example and ci
  # values files could not render because it did.
  - it: accepts a provisioning key alongside pangolinEndpoint
    set:
      siteInstances:
        - name: main-tunnel
          enabled: true
          pangolinEndpoint: https://pangolin.example.com
          provisioningKey: prov-key
          siteName: my-site
    asserts:
      - hasDocuments:
          count: 0

  - it: still rejects an inline id without a secret
    set:
      siteInstances:
        - name: main-tunnel
          enabled: true
          pangolinEndpoint: https://pangolin.example.com
          id: only-id
    asserts:
      - failedTemplate:
          errorMessage: "siteInstances: Inline credentials require pangolinEndpoint, id, and secret to be set together."

  - it: still rejects an inline secret without an id
    set:
      siteInstances:
        - name: main-tunnel
          enabled: true
          pangolinEndpoint: https://pangolin.example.com
          secret: only-secret
    asserts:
      - failedTemplate:
          errorMessage: "siteInstances: Inline credentials require pangolinEndpoint, id, and secret to be set together."

  - it: still rejects an endpoint with no credential of any kind
    set:
      siteInstances:
        - name: main-tunnel
          enabled: true
          pangolinEndpoint: https://pangolin.example.com
    asserts:
      - failedTemplate:
          errorMessage: "siteInstances: Credentials required. Either set inline credentials (pangolinEndpoint/id/secret), siteInstances[].auth.existingSecretName, siteInstances[].provisioningKey, enable auth.envVarsDirect with inline credentials, or provide mtls.secretName/mtls.p12Base64."
