siteInstances:
  - name: main-tunnel
    enabled: true
    pangolinEndpoint: https://pangolin.example.com

    provisioningKey: "YOUR_PROVISIONING_KEY"
    siteName: "my-site"

    configPersistence:
      enabled: true
      type: persistentVolumeClaim
      existingClaim: my-site-config
      mountPath: /var/lib/pangolin
      fileName: config.json
