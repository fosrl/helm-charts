apiVersion: v2
version: 0.1.0
appVersion: "0.20.0"
kubeVersion: ">=1.30.14-0"
name: pangolin-cli
description: Helm chart to run Pangolin sites with the Pangolin CLI (fosrl/cli)
type: application
keywords:
  - pangolin
  - pangolin-cli
  - site
  - vpn
  - wireguard
  - networking
home: https://digpangolin.com/
icon: https://raw.githubusercontent.com/fosrl/pangolin/refs/heads/main/public/logo/pangolin_orange.svg
sources:
  - https://github.com/fosrl/helm-charts
  - https://github.com/fosrl/cli
maintainers:
  - name: Fossorial Inc
    email: contact@pangolin.net
annotations:
  artifacthub.io/category: networking
  artifacthub.io/changes: |
    - kind: added
      description: "Initial release. Runs Pangolin sites with `pangolin-cli up site`, configured through SITE_* environment variables or CLI flags."
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/images: |
    - name: pangolin-cli-dockerhub
      image: docker.io/fosrl/pangolin-cli:0.20.0
      whitelisted: false
      platforms:
        - linux/amd64
        - linux/arm64
        - linux/arm/v7
    - name: pangolin-cli-ghcr
      image: ghcr.io/fosrl/cli:0.20.0
      whitelisted: false
      platforms:
        - linux/amd64
        - linux/arm64
        - linux/arm/v7
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: support
      url: https://github.com/fosrl/helm-charts/issues
    - name: documentation
      url: https://docs.digpangolin.com/self-host/manual/kubernetes
  artifacthub.io/prerelease: "false"
  artifacthub.io/signKey: |
    fingerprint: 020FEFE9F1112F53EEEFF45949B94CAFF38EB86E
    url: https://charts.fossorial.io/pgp_keys.asc

