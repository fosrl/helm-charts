apiVersion: v2
version: 0.1.0
appVersion: "1.26.0"
kubeVersion: ">=1.30.14-0"
name: pangolin
description: Pangolin Helm Chart
type: application
keywords:
  - pangolin
  - vpn
  - wireguard
  - networking
home: https://digpangolin.com/
icon: https://raw.githubusercontent.com/fosrl/pangolin/refs/heads/main/public/logo/pangolin_orange.svg
sources:
  - https://github.com/fosrl/helm-charts
  - https://github.com/fosrl/pangolin
maintainers:
  - name: Fossorial Inc
    email: contact@pangolin.net
dependencies:
  - name: cloudnative-pg
    alias: cnpg-operator
    version: 0.29.2
    repository: https://cloudnative-pg.github.io/charts
    condition: cnpg-operator.enabled
  - name: cluster
    alias: cnpg-cluster
    version: 0.9.0
    repository: https://cloudnative-pg.github.io/charts
    condition: cnpg-cluster.enabled
  - name: traefik
    alias: traefikController
    version: 42.4.1
    repository: https://traefik.github.io/charts
    condition: deployment.installTraefikController
annotations:
  artifacthub.io/category: networking
  artifacthub.io/changes: |
    - kind: changed
      description: "Pangolin v1.26.0, Gerbil v1.6.0, pangolin-kube-controller v0.1.0, Badger v1.8.0, Traefik v3.7.19 (chart 42.4.1) and CloudNativePG charts 0.29.2/0.9.0. The chart leaves prerelease."
    - kind: changed
      description: "BREAKING (standalone, multi): the chart-managed Traefik runs in the Gerbil Pod so it can reach tunnel backends. Set traefik.runInGerbilPod=false for the previous layout."
    - kind: added
      description: "Pangolin 1.23-1.26 settings: server.trust_ips, server.custom_ip_header and offline_checker.*; controller.config.ingressClass and resyncInterval."
    - kind: fixed
      description: "Pangolin can reach the Gerbil API under the chart NetworkPolicy, so tunnels come up (#39)."
    - kind: fixed
      description: "The chart-managed Traefik passes its probes, can issue ACME certificates, can read the Kubernetes API, and gets the ACME PVC it mounts."
    - kind: fixed
      description: "Fix extraVolumes/extraVolumeMounts rendering, controller Kubernetes API egress, dashboard ingress defaults and the in-cluster internal_hostname."
  artifacthub.io/images: |
    - name: pangolin-dockerhub
      image: docker.io/fosrl/pangolin:1.26.0
      whitelisted: false
      platforms:
        - linux/amd64
        - linux/arm64
        - linux/arm/v7
    - name: pangolin-ghcr
      image: ghcr.io/fosrl/pangolin:1.26.0
      whitelisted: false
      platforms:
        - linux/amd64
        - linux/arm64
        - linux/arm/v7
    - name: pangolin-postgresql-dockerhub
      image: docker.io/fosrl/pangolin:postgresql-1.26.0
      whitelisted: false
      platforms:
        - linux/amd64
        - linux/arm64
        - linux/arm/v7
    - name: pangolin-postgresql-ghcr
      image: ghcr.io/fosrl/pangolin:postgresql-1.26.0
      whitelisted: false
      platforms:
        - linux/amd64
        - linux/arm64
        - linux/arm/v7
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: support
      url: https://github.com/fosrl/helm-charts/issues
    - name: documentation
      url: https://docs.digpangolin.com/self-host/manual/kubernetes
  artifacthub.io/prerelease: "false"
  artifacthub.io/recommendations: |
    - url: https://artifacthub.io/packages/helm/fosrl/newt
  artifacthub.io/signKey: |
    fingerprint: 48E7F670FCC13645FC48B08D587294B228C2EC2C
    url: https://charts.fossorial.io/pgp_keys.asc
  artifacthub.io/screenshots: |
    - title: Pangolin-UI
      url: https://github.com/fosrl/pangolin/raw/main/public/screenshots/hero.png

