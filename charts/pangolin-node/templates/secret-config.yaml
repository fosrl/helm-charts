{{- include "pangolin-node.validate" . -}}
{{- if not .Values.config.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pangolin-node.configSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pangolin-node.labels" . | nindent 4 }}
  {{- with (include "pangolin-node.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  config.yml: |
    {{- include "pangolin-node.config" . | nindent 4 }}
{{- end }}
