{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pangolin-node.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pangolin-node.labels" . | nindent 4 }}
  {{- $anns := mergeOverwrite (dict) (include "pangolin-node.annotations" . | fromYaml) (.Values.serviceAccount.annotations | default dict) }}
  {{- if $anns }}
  annotations:
    {{- toYaml $anns | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
