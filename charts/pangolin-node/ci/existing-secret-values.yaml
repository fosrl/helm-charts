# Keep the node credentials out of Helm values.
#
#   kubectl -n pangolin create secret generic pangolin-node-credentials \
#     --from-literal=id=<node id> --from-literal=secret=<node secret>
#
# An init container merges them into config.yml when the Pod starts.
config:
  managed:
    existingSecret: pangolin-node-credentials
  gerbil:
    base_endpoint: node.yourdomain.example
