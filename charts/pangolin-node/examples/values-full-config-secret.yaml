# Supply the whole config.yml yourself.
#
#   kubectl -n pangolin create secret generic pangolin-node-config --from-file=config.yml
#
# The file must keep these values for the single-Pod layout:
#   server.internal_hostname: 127.0.0.1
#   gerbil.reachable_at: http://127.0.0.1:3003
config:
  existingSecret: pangolin-node-config
  existingSecretKey: config.yml
