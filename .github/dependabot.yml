version: 2

updates:
  - package-ecosystem: "helm"
    directories:
      - "/charts/newt"
      - "/charts/pangolin"
      - "/charts/pangolin-cli"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 1
    groups:
      helm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
